version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: tsd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ---- AlphaPulse Postgres (source of truth for portfolio, decisions, memory) ----
  alphapulse-db:
    image: pgvector/pgvector:pg16
    container_name: tsd-alphapulse-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=alphapulse
      - POSTGRES_PASSWORD=alphapulse
      - POSTGRES_DB=alphapulse
    volumes:
      - alphapulse_db_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphapulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  langfuse-server:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: tsd-langfuse
    ports:
      - "9876:3000"
    depends_on:
      - langfuse-db
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:9876
      - NEXTAUTH_SECRET=mysecret
    restart: unless-stopped

  langfuse-db:
    image: postgres:15-alpine
    container_name: tsd-langfuse-db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  langfuse_db_data:
  alphapulse_db_data:
